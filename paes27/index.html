<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PAES 2027 · Hub</title>
<style>
/* == paes27-css v3 == */
/* Sistema de diseño PAES·27 · dicarch (prototipo C). Claro: «azulejos vivos». Oscuro: «Riso noche» (Numeria).
   Las pizarras, sus leyendas y las fórmulas son SIEMPRE oscuras (azul noche), en ambos temas.
   Se copia IDÉNTICO en cada página con tools/sync_core.py: edita tools/core.css. */
@font-face{font-family:"Nunito Sans";src:url(lib/fonts/nunito-sans-latin-wght-normal.woff2) format("woff2");font-weight:200 1000;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(lib/fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#F4F6FB;--panel:#FFFFFF;--panel2:#EEF1F8;--line:#DDE3EE;--ink:#14162B;--muted:#5D6478;
  --acc:#2563EB;--acc2:#0E9DB4;--ok:#0B8F55;--mal:#D4145A;--warn:#C46A00;--okf:#18D98B;--malf:#E5157A;
  --cv:#FFFFFF;--cv-panel:#E4E9F3;--cv-panel2:#CBD3E2;
  --m2:#0E8BD8;--cie:#0BAE6A;--m1:#F08A00;--len:#E5157A;
  --m2-g:linear-gradient(135deg,#10B6C8,#0E8BD8);--cie-g:linear-gradient(135deg,#18D98B,#0BAE6A);--m1-g:linear-gradient(135deg,#FF8A1F,#FFC53A);--len-g:linear-gradient(135deg,#E5157A,#F2295F);
  --sobre:#FFFFFF;--btn:linear-gradient(135deg,#E5157A,#FF8A1F);--btn-ink:#FFFFFF;
  --borde:1px solid rgba(20,22,43,.07);--sombra:0 10px 30px -14px rgba(20,22,43,.28);--sombra-sm:0 4px 14px -8px rgba(20,22,43,.3);--sombra-btn:0 6px 16px -8px rgba(229,21,122,.6);
  --r:20px;--r-sm:14px;
  --fondo:radial-gradient(40% 30% at 8% 0%,rgba(16,182,200,.14),transparent 70%),radial-gradient(35% 30% at 95% 5%,rgba(229,21,122,.10),transparent 70%),radial-gradient(40% 35% at 85% 100%,rgba(255,138,31,.10),transparent 70%);
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1E1F22;--panel:#2B2D31;--panel2:#35373C;--line:#3C3F45;--ink:#DBDEE1;--muted:#9AA0A8;
  --acc:#7C9DFF;--acc2:#4FD1E8;--ok:#79E22B;--mal:#FF5C66;--warn:#FFCB33;--okf:#79E22B;--malf:#FF5C66;
  --cv:#17181B;--cv-panel:#2B2D31;--cv-panel2:#3E4148;
  --m2:#5B8CFF;--cie:#79E22B;--m1:#FF9E4D;--len:#FF5C66;
  --m2-g:#5B8CFF;--cie-g:#79E22B;--m1-g:#FF9E4D;--len-g:#FF5C66;
  --sobre:#0F1923;--btn:#5B8CFF;--btn-ink:#0F1923;
  --borde:2px solid rgba(219,222,225,.12);--sombra:0 4px 0 0 #0C0C0E;--sombra-sm:0 2px 0 0 #0C0C0E;--sombra-btn:0 4px 0 0 #0C0C0E;
  --r:16px;--r-sm:12px;--fondo:none;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#1E1F22;--panel:#2B2D31;--panel2:#35373C;--line:#3C3F45;--ink:#DBDEE1;--muted:#9AA0A8;
  --acc:#7C9DFF;--acc2:#4FD1E8;--ok:#79E22B;--mal:#FF5C66;--warn:#FFCB33;--okf:#79E22B;--malf:#FF5C66;
  --cv:#17181B;--cv-panel:#2B2D31;--cv-panel2:#3E4148;
  --m2:#5B8CFF;--cie:#79E22B;--m1:#FF9E4D;--len:#FF5C66;
  --m2-g:#5B8CFF;--cie-g:#79E22B;--m1-g:#FF9E4D;--len-g:#FF5C66;
  --sobre:#0F1923;--btn:#5B8CFF;--btn-ink:#0F1923;
  --borde:2px solid rgba(219,222,225,.12);--sombra:0 4px 0 0 #0C0C0E;--sombra-sm:0 2px 0 0 #0C0C0E;--sombra-btn:0 4px 0 0 #0C0C0E;
  --r:16px;--r-sm:12px;--fondo:none;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fondo),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,summary,.disp{font-family:"Bricolage Grotesque","Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h2{font-size:1.3rem}h3{font-size:1.08rem}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 32px}
.card{background:var(--panel);border:var(--borde);border-radius:var(--r);box-shadow:var(--sombra);padding:16px;margin:14px 0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:.3em;background:var(--btn);color:var(--btn-ink);border:0;border-radius:var(--r-sm);padding:.6em 1.1em;font:800 1rem/1.1 "Bricolage Grotesque","Nunito Sans",system-ui,sans-serif;cursor:pointer;box-shadow:var(--sombra-btn);transition:transform .08s,box-shadow .08s,filter .1s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.sec{background:var(--panel);color:var(--ink);border:var(--borde);box-shadow:var(--sombra-sm)}
.btn.mini{padding:.4em .8em;font-size:.88rem}
kbd{font:700 .7em ui-monospace,monospace;background:rgba(127,127,127,.22);border-radius:5px;padding:.1em .35em;margin-left:.3em}
/* encabezado, marca y pie */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.marca svg{width:44px;height:44px;flex:none}
.marca b{display:block;font:800 1.45rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.marca small{display:block;color:var(--muted);font-weight:800;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
.paginas{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.paginas a,.paginas span{padding:.4em .85em;border-radius:999px;font-weight:800;font-size:.88rem;text-decoration:none;color:var(--ink);background:var(--panel);border:var(--borde);box-shadow:var(--sombra-sm)}
.paginas a.on{background:var(--c,var(--m2-g));color:var(--sobre);border-color:transparent}
.paginas span{color:var(--muted);box-shadow:none;border-style:dashed}
.tema-btn{width:40px;height:40px;border-radius:12px;border:var(--borde);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sombra-sm)}
.firma{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700;padding:18px 0 6px}
.firma img{width:30px;height:30px;border-radius:8px}
.firma b{font-family:"Bricolage Grotesque",sans-serif;color:var(--ink)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:8px 0 6px}
.hero h1{font-size:clamp(1.6rem,1.15rem + 1.7vw,2.4rem);margin:0}
/* pestañas, paneles y acordeones */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;padding:5px;background:var(--panel2);border-radius:var(--r-sm)}
.tabs button{background:none;border:0;color:var(--muted);font:800 .92rem/1 "Bricolage Grotesque",sans-serif;padding:.65em .9em;cursor:pointer;border-radius:10px}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sombra-sm)}
.pane{display:none}.pane.on{display:block}
details.acc{background:var(--panel2);border-radius:var(--r-sm);margin:12px 0}
details.acc>summary{cursor:pointer;padding:.75em 1em;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .15s}details.acc[open]>summary::after{transform:rotate(90deg)}
details.acc>.in{padding:0 1em 1em}
.chip{display:inline-block;padding:.15em .6em;border-radius:99px;font-size:.74rem;font-weight:900;background:var(--panel2);color:var(--muted)}
.chip.A{background:color-mix(in srgb,var(--mal) 16%,transparent);color:var(--mal)}
.chip.B{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.C{color:var(--muted)}
.chip.R{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.nuevo{background:color-mix(in srgb,var(--cie) 18%,transparent);color:var(--ok)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.txt-ok{color:var(--ok)}.txt-mal{color:var(--mal)}.txt-warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=range]{accent-color:var(--pag-solo,var(--m2));width:100%;height:24px}
select,input[type=time],input[type=number],textarea{background:var(--panel2);color:var(--ink);border:var(--borde);border-radius:10px;padding:.35em .55em;font:inherit}
code{background:var(--panel2);padding:.1em .4em;border-radius:6px;font-size:.92em}
/* pregunta (práctica, diagnóstico, ensayo) */
.q{background:var(--panel);border:var(--borde);border-radius:var(--r);box-shadow:var(--sombra);padding:16px}
.q-meta{font-size:.74rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.q-enun{font-size:1.05rem;font-weight:600;margin-bottom:12px}
.q-enun table{border-collapse:collapse;margin:8px 0}.q-enun td,.q-enun th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.q-ops{display:grid;gap:9px}
.q-op{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:.7em .9em;font:inherit;font-weight:700;cursor:pointer;transition:transform .06s,border-color .1s}
.q-op:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.q-op:disabled{cursor:default}
.q-l{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 .95rem/1 "Bricolage Grotesque",sans-serif;background:var(--panel);color:var(--ink)}
.q-op.ok{border-color:var(--okf);background:color-mix(in srgb,var(--okf) 16%,var(--panel))}.q-op.ok .q-l{background:var(--okf);color:#0F1923}
.q-op.mal{border-color:var(--malf);background:color-mix(in srgb,var(--malf) 14%,var(--panel))}.q-op.mal .q-l{background:var(--malf);color:#fff}
.q-op.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel))}.q-op.sel .q-l{background:var(--acc);color:var(--sobre)}
.q-fb{margin-top:10px}
.q-trampa{margin:8px 0;padding:10px 12px;border-left:5px solid var(--malf);border-radius:12px;background:color-mix(in srgb,var(--malf) 12%,var(--panel))}
.q-exp{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.q-acc{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* lecciones */
.leccion{background:var(--panel);border:var(--borde);border-radius:var(--r);box-shadow:var(--sombra);padding:18px;margin:16px 0}
.lec-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer;user-select:none}
.lec-head h2{margin:0 6px 0 0;font-size:1.22rem}
.lec-head::before{content:"";width:12px;height:12px;flex:none;border-right:3px solid var(--acc);border-bottom:3px solid var(--acc);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.leccion.cerrada .lec-head::before{transform:rotate(-45deg)}
.leccion.cerrada .lec-body{display:none}
.leccion.cerrada{padding:13px 18px}
.dom{margin-left:auto;font-size:.74rem;font-weight:900;padding:.2em .65em;border-radius:99px;background:var(--panel2)}
.idea{background:var(--panel2);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0;font-weight:600}
.paso{margin:20px 0}
.pasos{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.pasos button{border:0;border-radius:99px;padding:.45em .85em;background:var(--panel2);color:var(--muted);font:800 .86rem/1.1 "Bricolage Grotesque","Nunito Sans",sans-serif;cursor:pointer;transition:background .12s,color .12s}
.pasos button:hover{color:var(--ink)}
.pasos button.on{background:var(--pag,var(--m2-g));color:var(--sobre)}
.paso-pane{display:none}.paso-pane.on{display:block;animation:apar .25s ease}
.con-pasos .paso{margin:14px 0 8px}.con-pasos .paso>h3{display:none}
.con-pasos .paso-pane.multi .paso>h3{display:flex;margin-top:18px}.con-pasos .paso-pane.multi .paso>h3 .n{display:none}
.con-pasos details.acc.porque{background:none;margin:14px 0 8px}.con-pasos details.acc.porque>summary{display:none}.con-pasos details.acc.porque>.in{padding:0}
.paso-sig{display:flex;justify-content:flex-end;margin-top:14px}
.paso>h3{display:flex;align-items:center;gap:9px}
.paso>h3 .n,details.acc>summary .n{display:inline-grid;place-items:center;min-width:1.75em;height:1.75em;padding:0 .3em;border-radius:9px;background:var(--btn);color:var(--btn-ink);font-size:.85rem}
.cv,.formula,.sd-demo,.cv+.cap,.sd-demo+.cap{
  --ink:#DBDEE1;--muted:#9AA3B2;--line:#35406A;--panel:#1F2747;--panel2:#2A3359;--sobre:#0F1923;
  --acc:#7C9DFF;--acc2:#4FD1E8;--ok:#79E22B;--mal:#FF5C66;--warn:#FFCB33;--okf:#79E22B;--malf:#FF5C66;
  --cv:#121830;--cv-panel:#1E2645;--cv-panel2:#333C60;--borde:1px solid rgba(147,160,187,.16);color:var(--ink)}
.cv{position:relative;min-width:0;border-radius:14px;overflow:hidden;border:0;background:var(--cv)}
.cv:has(+.cap),.sd-demo:has(+.cap){border-bottom-left-radius:0;border-bottom-right-radius:0}
.cv+.cap,.sd-demo+.cap{margin:0;background:var(--cv);border-top:1px solid rgba(147,160,187,.12);border-radius:0 0 14px 14px;padding:8px 12px;font-weight:600;font-size:.93rem}
.cv canvas{display:block;width:100%}
.cv.tres{height:340px}.cv.tres canvas{height:100%!important}
.manip{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.manip{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:grid;gap:8px}
.sl{display:grid;gap:2px;font-size:.92rem;font-weight:700}
.sl b{color:var(--pag-solo,var(--m2));font-variant-numeric:tabular-nums}
.formula{background:var(--cv);border-radius:14px;padding:12px 14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.8}
.formula .res{font-weight:800}
.formula .hl{color:var(--warn);font-weight:800}
.cap{margin:8px 0 0;min-height:1.5em}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-weight:700;margin-top:4px}
.ley i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
/* «el porqué» como viñetas visuales */
details.acc>.in>ol{counter-reset:v;list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
details.acc>.in>ol>li{counter-increment:v;position:relative;background:var(--panel);border:var(--borde);border-radius:var(--r-sm);box-shadow:var(--sombra-sm);padding:40px 12px 12px;font-size:.95rem;line-height:1.5}
details.acc>.in>ol>li::before{content:counter(v);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--btn);color:var(--btn-ink);font:800 .85rem/1 "Bricolage Grotesque",sans-serif}
details.acc>.in>ol>li:not(:last-child)::after{content:"→";position:absolute;right:12px;top:8px;color:var(--muted);font-weight:900;font-size:1.1rem}
details.acc>.in>ol>li b{display:inline-block;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--ink);border-radius:8px;padding:.05em .4em;margin:.1em 0;font-weight:800}
details.acc>.in>ol>li .esq{display:block;width:100%;height:auto;max-height:110px;margin:-2px 0 8px;overflow:visible;color:var(--ink)}
details.acc>.in>ol>li .esq .a{stroke:var(--acc);fill:none}details.acc>.in>ol>li .esq .b{stroke:var(--acc2);fill:none}
details.acc>.in>ol>li .esq .w{stroke:var(--warn);fill:none}details.acc>.in>ol>li .esq .r{stroke:var(--mal);fill:none}details.acc>.in>ol>li .esq .g{stroke:var(--ok);fill:none}
details.acc>.in>ol>li .esq .m{stroke:var(--muted);fill:none}details.acc>.in>ol>li .esq text{fill:currentColor;font:800 12px "Nunito Sans",sans-serif;stroke:none}
details.acc>.in>ol>li .esq .fa{fill:var(--acc);stroke:none}details.acc>.in>ol>li .esq .fr{fill:var(--mal);stroke:none}details.acc>.in>ol>li .esq .fg{fill:var(--ok);stroke:none}details.acc>.in>ol>li .esq .fm{fill:var(--muted);stroke:none}details.acc>.in>ol>li .esq .fw{fill:var(--warn);stroke:none}details.acc>.in>ol>li .esq .fb{fill:var(--acc2);stroke:none}
/* ejemplo resuelto y práctica */
.ejemplo .enun{font-weight:700;margin-bottom:8px}
.ejemplo ol{margin:0;padding-left:1.4em}
.ejemplo li{margin:7px 0;animation:apar .35s ease}
@keyframes apar{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.ejemplo .trampa-ej{margin-top:10px;padding:8px 12px;border-left:5px solid var(--warn);border-radius:10px;background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.niveles{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.niveles button.on{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.resumen-nivel{background:var(--panel2);border-radius:var(--r);padding:14px}
table.t2{border-collapse:collapse;margin:4px 0;font-variant-numeric:tabular-nums}
table.t2 td,table.t2 th{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.t2 .hl{background:color-mix(in srgb,var(--warn) 22%,transparent)}table.t2 .hl2{background:color-mix(in srgb,var(--acc2) 20%,transparent)}
.pend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pend .card{margin:0;box-shadow:none;border-style:dashed}
.sd-demo{background:var(--cv);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:200px}
.sd-caso>div{margin:4px 0}
.sd-lista{margin:0;padding:0;list-style:none}.sd-lista li{padding:3px 8px;border-radius:8px;transition:opacity .3s}
.sd-lista li.tach{text-decoration:line-through;opacity:.35}.sd-lista li.fin{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:800}
.sd-opciones{margin:-4px 0 8px}
@media (max-width:700px){.sd-demo{grid-template-columns:1fr}}
/* lecciones en formato tarjeta */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0 16px}
.tarjeta{background:var(--panel2);border-radius:var(--r-sm);padding:12px 14px}
.tarjeta h4{margin:6px 0 4px;font:800 1.05rem/1.2 "Bricolage Grotesque",sans-serif}
.tarjeta p{margin:0;font-size:.93rem}
.tarjeta .onda{display:inline-block;font-size:.72rem;font-weight:900;padding:.15em .55em;border-radius:99px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
/* ensayo */
.ens-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.ens-reloj{font:800 1.35rem/1 "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.ens-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}
.ens-grilla button{background:var(--panel2);color:var(--muted);border:2px solid transparent;border-radius:9px;padding:5px 0;font:800 .85rem/1.2 "Nunito Sans",sans-serif;cursor:pointer}

        b.prueba = 'M1'; b.tema = elegirTema(temasDe('M1'), dom, usadosHoy, fecha);
      } else b.prueba = s.prueba;
      b.id = `${fecha}#${k}:${b.tipo}:${b.tema || b.prueba}`;
      b.hecho = hechos.has(b.id);
      bloques.push(b);
    });
    // mañana M2, tarde Física (orden estable dentro del día)
    const ordenPr = { M2: 0, CIE: 1, M1: 2, LEN: 3 };
    if (fecha >= '2026-11-23' && fecha <= '2026-11-25') {
      const flex = bloques.filter((b) => b.tipo === 'flex').sort((a, b) => ordenPr[a.prueba] - ordenPr[b.prueba]);
      let i = 0; bloques.forEach((b, j) => { if (b.tipo === 'flex') bloques[j] = flex[i++]; });
      let sl = 0; bloques.forEach((b) => { if (b.slot !== null) { b.slot = sl; sl += b.slots; } });
    }
    dias[fecha] = bloques;
  }
  const ruta = { v: P27.VERSION, generado: new Date().toISOString(), N, inicio, dias };
  guardar('ruta', ruta);
  return ruta;
}

function elegirTema(lista, dom, usadosHoy, fecha) {
  let mejor = null, mv = -1;
  for (const t of lista) {
    let v = PESO_PRIO[t.prio] * (1 - dom[t.id] / 100);
    if (t.leccion) v *= 1.25;
    if (usadosHoy.has(t.id)) v *= 0.3;
    if (v > mv) { mv = v; mejor = t; }
  }
  if (!mejor) return null;
  usadosHoy.add(mejor.id);
  dom[mejor.id] = Math.min(95, dom[mejor.id] + 20);
  return mejor.id;
}

function horaSlot(inicio, slot) {
  const [h, m] = inicio.split(':').map(Number);
  let min = h * 60 + m + slot * 60 + (slot >= 3 ? 60 : 0); // almuerzo de 1 h después del 3.er bloque
  return `${String(Math.floor(min / 60) % 24).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
}
function finSlot(inicio, slot, slots) {
  const ini = horaSlot(inicio, slot + slots - 1);
  const [h, m] = ini.split(':').map(Number);
  const min = h * 60 + m + 50;
  return `${String(Math.floor(min / 60) % 24).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
}

const FASE_LECCION = { M2: 'la Fase 2', CIE: 'la Fase 3', M1: 'la Fase 4', LEN: 'la Fase 5' };
function describirBloque(b, diag) {
  const t = b.tema ? TEMAS[b.tema] : null;
  const pr = PRUEBAS[b.prueba] || null;
  switch (b.tipo) {
    case 'diag': {
      const prs = b.prueba.split('+');
      const nombres = prs.map((p) => PRUEBAS[p].corto).join(' + ');
      return { tit: `Diagnóstico ${nombres}`, det: prs.map((p) => `${DIAG[p].length} preguntas de ${PRUEBAS[p].corto}`).join(' · '), link: '#diag', hecho: prs.every((p) => diag[p]) };
    }
    case 'flex': case 'rescate': case 'm1': {
      const pref = b.tipo === 'rescate' ? 'Rescate Bio/Quím' : b.tipo === 'm1' ? 'M1 · trampas' : pr.corto;
      if (t && t.leccion) return { tit: `${pref} · ${t.nombre}`, det: 'Lección completa · termina con el nivel PAES', link: t.leccion };
      const fase = b.tipo === 'rescate' ? 'la Fase 4' : FASE_LECCION[b.prueba];
      return { tit: `${pref} · ${t ? t.nombre : '—'}`, det: `La lección de este tema llega en ${fase}. Mientras: estúdialo con tu material y practica preguntas reales de ese eje en los modelos DEMRE.`, link: null };
    }
    case 'len': return b.ficha
      ? { tit: 'Lectora · trampas típicas (30 min)', det: 'Repasa los errores de tu diagnóstico de Lectora: absolutos, detalles convertidos en tesis, inferencias que el texto no permite.' }
      : { tit: 'Lectora · estrategias (30 min)', det: 'Un texto corto cronometrado: primero la pregunta, luego el párrafo. Anota qué tipo de pregunta era (localizar, interpretar, evaluar).' };
    case 'ensayo': return { tit: 'ENSAYO M2 completo cronometrado', det: '55 preguntas en 2 h 20 min, como el día de la prueba (M2 → Ensayo). Si ya viste casi todas las preguntas de la app, haz además el modelo oficial DEMRE.', link: 'm2.html#ensayo' };
    case 'revision': return { tit: 'Revisión de errores del ensayo M2', det: 'Por cada error: ¿fue concepto, cálculo o trampa? Anótalo en la ficha.' };
    case 'parcial': return { tit: 'Ensayo parcial de Física', det: '40 preguntas en 80 min (Física → Ensayo). Revisa los errores al final.', link: 'fisica.html#ensayo' };
    case 'ficha': return { tit: `Ficha final de ${pr.corto}`, det: 'Fórmulas y trampas en una página. Nada nuevo.', link: '#fichas' };
    case 'repaso': return { tit: 'Repaso espaciado', det: 'Temas fallados que vuelven hoy. Ve a la pestaña Repaso.', link: '#repaso' };
    default: return { tit: b.tipo, det: '' };
  }
}

function filaBloque(b, ruta, fecha, diag) {
  const d = describirBloque(b, diag);
  const hora = b.slot === null ? 'cierre' : `${horaSlot(ruta.inicio, b.slot)}–${finSlot(ruta.inicio, b.slot, b.slots)}`;
  const hecho = b.tipo === 'diag' ? d.hecho : b.hecho;
  const fila = el('div', 'bloque' + (hecho ? ' hecho' : ''));
  const chk = el('input'); chk.type = 'checkbox'; chk.checked = !!hecho; chk.title = 'Marcar como hecho';

  chk.addEventListener('change', () => {
    const r = cargar('ruta', null); if (!r) return;
    const x = r.dias[fecha].find((y) => y.id === b.id); if (x) x.hecho = chk.checked;
    guardar('ruta', r);

  });
  fila.appendChild(chk);

  const pr = b.prueba && b.prueba.split('+')[0];
  const tag = pr && PRUEBAS[pr] ? `<span class="tag" style="--c:${COLOR[pr]}">${esc(b.tipo === 'rescate' ? 'B/Q' : PRUEBAS[pr].corto)}</span>` : '';
  let tit = `${tag}<span class="tit">${esc(d.tit)}</span>`;
  if (d.link) tit = `<a href="${esc(d.link)}" style="color:inherit">${tit}</a>`;
  let domTxt = '';
  if (b.tema) { const v = P27.dominio(b.tema); domTxt = ` · <span style="color:${P27.colorDominio(v)}">dominio ${v === null ? 'sin dato' : v + ' %'}</span>`; }
  fila.appendChild(el('div', '', `${tit}<div class="det">${esc(d.det)}${domTxt}</div>`));
  return fila;
}

function tarjetaDia(fecha, ruta, diag) {
  const h = hoy();
  const card = el('div', 'dia' + (fecha === h ? ' hoy' : fecha < h ? ' pasado' : ''));

  bloques.forEach((b) => card.appendChild(filaBloque(b, ruta, fecha, diag)));

}

function tarjetaEvento(fecha) {
  const h = hoy();
  const card = el('div', 'dia' + (fecha === h ? ' hoy' : fecha < h ? ' pasado' : ''));
  card.appendChild(el('h3', '', `<span>${fechaCorta(fecha)}${fecha === h ? ' · HOY' : ''}</span><span class="small muted">día de prueba</span>`));

  }

}

function rutaActual() {
  let r = cargar('ruta', null);

}

// Práctica rápida: 3 preguntas de un tema que vuelve en el repaso o de tu tema más débil.
const PREG_LECCIONES = [...JSON.parse($('#banco-m2').textContent || '[]'), ...JSON.parse($('#banco-fis').textContent || '[]')];
const barajar = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let rapida = null; // { tema, qs, i, aciertos, motivo }
function nuevaRapida(excluir) {
  const conPreg = (t) => t !== excluir && TEMAS[t] && PREG_LECCIONES.some((q) => q.tema === t);
  let tema = P27.repasoPendiente().find(conPreg), motivo = 'repaso';
  if (!tema) {
    const dom = cargar('dominio', {});
    tema = Object.keys(dom).filter(conPreg).sort((a, b) => dom[a] - dom[b])[0]; motivo = 'debil';
  }
  if (!tema) return null;
  const v = P27.dominio(tema);
  const nivel = v === null || v < 40 ? 'basico' : v < 70 ? 'paes' : 'dificil';
  const delTema = PREG_LECCIONES.filter((q) => q.tema === tema);
  const qs = [...barajar(delTema.filter((q) => q.nivel === nivel)), ...barajar(delTema.filter((q) => q.nivel !== nivel))].slice(0, 3);
  return { tema, qs, i: 0, aciertos: 0, motivo };
}
const NIVEL_META = { basico: 'Básico', paes: 'PAES', dificil: 'Difícil' };
function pintarRapida(card) {
  card.innerHTML = '';

    card.appendChild(el('div', '', '<div class="q-meta">Práctica rápida</div><p>Cuando tengas datos de dominio (después de los diagnósticos), aquí te tocan 3 preguntas de tu tema más débil o de lo que vuelve en el repaso.</p>'));
    return;
  }
  const T = TEMAS[rapida.tema];
  if (rapida.i >= rapida.qs.length) {
    const v = P27.dominio(rapida.tema);
    const c = el('div', '', `<div class="q-meta">${rapida.motivo === 'repaso' ? 'Repaso' : 'Práctica rápida'} · ${esc(T.nombre)}</div><h2>${rapida.aciertos}/${rapida.qs.length} correctas</h2><p>Tu dominio de <b>${esc(T.nombre)}</b> quedó en <b style="color:${P27.colorDominio(v)}">${v === null ? '—' : v + ' %'}</b>. ${rapida.aciertos < rapida.qs.length ? 'Lo que fallaste vuelve mañana y en 3 días.' : '¡Bien!'}</p>`);
    const f = el('div', 'q-acc');

    const b = el('button', 'btn', 'Otra ronda <kbd>Enter</kbd>'); b.type = 'button';
    b.onclick = () => { rapida = nuevaRapida(rapida.aciertos === rapida.qs.length ? rapida.tema : null) || nuevaRapida(); pintarRapida(card); };
    f.appendChild(b); c.appendChild(f); card.appendChild(c);

  }

let runner = null; // {prueba, i, respuestas, seg, t0}

function iniciarDiag(pr, reanudar) {
  const diag = cargar('diag', {});
  if (reanudar && diag.enCurso && diag.enCurso.prueba === pr) runner = { ...diag.enCurso };
  else runner = { prueba: pr, i: 0, respuestas: [], seg: 0 };
  // un solo diagnóstico en curso a la vez
  diag.enCurso = { ...runner }; guardar('diag', diag);
  location.hash = 'diag';
  pintarPregunta();
}

function guardarEnCurso() {
  const diag = cargar('diag', {});
  diag.enCurso = { prueba: runner.prueba, i: runner.i, respuestas: runner.respuestas, seg: runner.seg };
  guardar('diag', diag);
}

function pintarPregunta() {
  const p = $('#p-diag'); p.innerHTML = '';
  const pr = runner.prueba; const qs = DIAG[pr]; const q = qs[runner.i];
  const top = el('div', 'run-top');
  top.innerHTML = `<div><b>Diagnóstico ${esc(PRUEBAS[pr].nombre)}</b> · pregunta ${runner.i + 1} de ${qs.length}</div><div class="small"><span id="reloj"></span> <span class="muted">· ritmo PAES ${fmtMin(RITMO[pr] * 60)} por pregunta</span></div>`;
  const salir = el('button', 'btn sec mini', 'Pausar y salir');
  salir.onclick = () => { clearInterval(timerId); runner = null; RENDER.diag(); };
  top.appendChild(salir);
  p.appendChild(top);
  p.appendChild(el('div', 'prog', `<i style="width:${(runner.i / qs.length) * 100}%"></i>`));
  let cont = p;
  if (pr === 'LEN') {
    const lay = el('div', 'len-layout');
    lay.appendChild(el('div', 'len-texto', `<h3>${esc(BANCO.LEN.titulo)}</h3>${BANCO.LEN.texto}`));
    cont = el('div'); lay.appendChild(cont); p.appendChild(lay);
  } else { cont = el('div'); p.appendChild(cont); }
  const t0 = Date.now();
  const reloj = () => { const r = $('#reloj'); if (r) r.textContent = `⏱ ${fmtMin(runner.seg + (Date.now() - t0) / 1000)}`; };
  clearInterval(timerId); timerId = setInterval(reloj, 1000); reloj();
  let tResp = null;
  P27.pregunta(cont, q, {
    noSe: true,
    mezclar: true, // la suficiencia de datos mantiene sus 5 alternativas fijas (lo resuelve el core)
    meta: `${esc(q.eje)} · ${esc(TEMAS[q.tema]?.nombre || q.tema)}`,
    textoSiguiente: runner.i + 1 < qs.length ? 'Siguiente' : 'Ver resultado',
    onRespuesta: ({ ok, elegida }) => {
      tResp = (Date.now() - t0) / 1000;
      runner.seg += tResp;
      clearInterval(timerId);
      runner.respuestas.push({ id: q.id, tema: q.tema, nivel: q.nivel, ok, elegida, seg: Math.round(tResp) });
      runner.i += 1;
      guardarEnCurso();
    },
    onSiguiente: () => { if (runner.i < qs.length) pintarPregunta(); else finalizarDiag(); },
  });
}

function finalizarDiag() {
  const pr = runner.prueba;
  const diag = cargar('diag', {});
  const resp = runner.respuestas;
  for (const r of resp) P27.registrar(r.tema, r.nivel, r.ok, { diag: true });
  const d2 = cargar('diag', {});
  d2[pr] = { fecha: hoy(), correctas: resp.filter((r) => r.ok).length, total: resp.length, seg: Math.round(runner.seg), respuestas: resp };
  delete d2.enCurso;
  guardar('diag', d2);
  runner = null;
  generarRuta();
  verResultado(pr);
  void diag;
}

function verResultado(pr) {
  const p = $('#p-diag'); p.innerHTML = '';
  const d = cargar('diag', {})[pr];
  if (!d) { RENDER.diag(); return; }
  const qs = Object.fromEntries(DIAG[pr].map((q) => [q.id, q]));
  const volver = el('button', 'btn sec mini', '← Volver a diagnósticos'); volver.onclick = () => RENDER.diag();
  p.appendChild(volver);
  const c = el('div', 'card');
  const pct = Math.round((d.correctas / d.total) * 100);
  let h = `<h2>${esc(PRUEBAS[pr].nombre)}: ${d.correctas}/${d.total} (${pct} %)</h2><p class="muted">Tiempo: ${fmtMin(d.seg)} min · promedio ${fmtMin(d.seg / d.total)} por pregunta (ritmo PAES ${fmtMin(RITMO[pr] * 60)}).</p>`;
  if (pr === 'CIE') {
    const fis = d.respuestas.filter((r) => r.tema.startsWith('fis.'));
    const bq = d.respuestas.filter((r) => /^(bio|qui)\./.test(r.tema));
    const okBq = bq.filter((r) => r.ok).length;
    h += `<p>Física: <b>${fis.filter((r) => r.ok).length}/${fis.length}</b> · Biología/Química: <b>${okBq}/${bq.length}</b></p>`;
    h += `<p class="small">${okBq <= 2 ? 'El Módulo Común trae preguntas de Biología y Química: con este resultado, el rescate vale la pena. La ruta te da <b>2 bloques diarios</b> el jueves y el viernes.' : 'Tu base de Biología/Química está aceptable: la ruta deja <b>1 bloque diario</b> de rescate rápido y el resto para Física.'}</p>`;
  }
  // por eje
  const ejes = {};
  for (const r of d.respuestas) { const e = qs[r.id]?.eje || '—'; ejes[e] = ejes[e] || [0, 0]; ejes[e][1]++; if (r.ok) ejes[e][0]++; }
  h += '<table class="res"><tr><th>Eje</th><th>Correctas</th></tr>' + Object.entries(ejes).map(([e, [a, b]]) => `<tr><td>${esc(e)}</td><td>${a}/${b}</td></tr>`).join('') + '</table>';
  c.innerHTML = h; p.appendChild(c);
  const c2 = el('div', 'card', '<h3>Pregunta por pregunta</h3>');
  const tb = el('table', 'res');
  tb.innerHTML = '<tr><th></th><th>Tema</th><th>Tiempo</th><th></th></tr>' + d.respuestas.map((r, i) => {
    const t = TEMAS[r.tema];
    const lnk = t && t.leccion ? `<a href="${t.leccion}">lección</a>` : '';
    return `<tr><td>${r.ok ? '<span class="txt-ok">✔</span>' : r.elegida === -1 ? '<span class="txt-warn">—</span>' : '<span class="txt-mal">✘</span>'} ${i + 1}</td><td>${esc(t?.nombre || r.tema)}</td><td>${r.seg}s</td><td>${lnk}</td></tr>`;
  }).join('');
  c2.appendChild(tb); p.appendChild(c2);
  const fallas = d.respuestas.filter((r) => !r.ok);
  if (fallas.length) {
    const c3 = el('div', 'card', '<h3>Revisa tus errores</h3><p class="small muted">Cada tema fallado vuelve en el repaso de mañana y en 3 días.</p>');
    fallas.forEach((r) => {
      const q = qs[r.id]; if (!q) return;
      const det = el('details', 'acc');
      det.innerHTML = `<summary>${esc(TEMAS[r.tema]?.nombre || r.tema)}</summary><div class="in"><div>${q.enunciado}</div>${r.elegida >= 0 ? `<p class="q-trampa"><b>Marcaste:</b> ${q.opciones[r.elegida].texto}. <b>La trampa:</b> ${q.opciones[r.elegida].trampa}</p>` : '<p class="muted">No respondiste.</p>'}<p><b>Correcta:</b> ${q.opciones[q.correcta].texto}. ${q.explicacion}</p></div>`;
      c3.appendChild(det);
    });
    p.appendChild(c3);
  }
  const sig = ORDEN_DIAG.find((x) => !cargar('diag', {})[x]);
  const f = el('div', 'fila');
  if (sig) { const b = el('button', 'btn', `Siguiente diagnóstico: ${PRUEBAS[sig].corto}`); b.onclick = () => iniciarDiag(sig, false); f.appendChild(b); }
  const r = el('button', 'btn sec', 'Ver mi ruta ajustada'); r.onclick = () => { location.hash = 'ruta'; }; f.appendChild(r);
  p.appendChild(f);
}

// ---------------- ruta ----------------
RENDER.ruta = () => {
  const p = $('#p-ruta'); p.innerHTML = '';
  const ruta = rutaActual();
  const diag = cargar('diag', {});
  const cfg = el('div', 'card');
  cfg.innerHTML = `<div class="fila"><label>Bloques de 50 min por día: <select id="selN">${[3, 4, 5, 6, 7, 8, 9, 10].map((n) => `<option ${n === ruta.N ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
  <label>Empiezo a las <input type="time" id="selIni" value="${esc(ruta.inicio)}"></label>
  <button class="btn sec mini" id="btnRecalc">Recalcular desde hoy</button></div>
  <p class="small muted" style="margin:.6em 0 0">Cada bloque: 50 min de estudio + 10 de pausa, con 1 h de almuerzo después del 3.º. El orden sale de <b>peso del tema × (1 − dominio) × cercanía de la prueba</b>: M2 pesa más al principio porque se rinde primero. Los días pasados no se tocan.</p>`;
  p.appendChild(cfg);
  const regen = () => { generarRuta({ N: Number($('#selN').value), inicio: $('#selIni').value || '09:00' }); RENDER.ruta(); };
  cfg.querySelector('#selN').onchange = regen;
  cfg.querySelector('#selIni').onchange = regen;
  cfg.querySelector('#btnRecalc').onclick = regen;
  for (const f of DIAS_RUTA) p.appendChild(tarjetaDia(f, ruta, diag));
  for (const f of Object.keys(EVENTOS)) p.appendChild(tarjetaEvento(f));
};

// ---------------- dominio ----------------
function filaDominio(t) {
  const T = TEMAS[t]; const v = P27.dominio(t);
  const r = el('div', 'dom-row');
  const nombre = T.leccion ? `<a href="${T.leccion}" style="color:inherit">${esc(T.nombre)}</a>` : esc(T.nombre);
  const pr = T.prueba === 'CIE' && T.prio === 'R' ? 'B/Q' : PRUEBAS[T.prueba].corto;
  r.innerHTML = `<div class="n"><span class="chip ${T.prio}">${T.prio}</span> ${nombre} <span class="small muted">· ${esc(pr)}</span></div><div class="bar"><i style="width:${v ?? 0}%;background:${P27.colorDominio(v)}"></i></div><div class="v" style="color:${P27.colorDominio(v)}">${v === null ? '—' : v + '%'}</div>`;
  return r;
}
RENDER.dominio = () => {
  const p = $('#p-dominio'); p.innerHTML = '';
  p.appendChild(el('p', 'muted small', 'Dominio de 0 a 100 %. Sube y baja con cada respuesta (pesa más acertar una difícil y fallar una básica). «—» = aún sin datos; para planificar se usa un valor inicial según tu nivel (M2 y Física 30 %, M1 60 %, Lectora 50 %). Prioridad: <span class="chip A">A</span> sale mucho y estás débil · <span class="chip B">B</span> · <span class="chip C">C</span> · <span class="chip R">R</span> rescate.'));
  const grupos = [['M2', 'M2', 'ABC'], ['Física', 'CIE', 'ABC'], ['Biología y Química (rescate)', 'CIE', 'R'], ['M1', 'M1', 'ABC'], ['Competencia Lectora', 'LEN', 'ABC']];
  for (const [tit, pr, prios] of grupos) {
    const lista = Object.values(TEMAS).filter((t) => t.prueba === pr && prios.includes(t.prio));
    const vals = lista.map((t) => P27.dominio(t.id)).filter((v) => v !== null);
    const prom = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    const c = el('div', 'card', `<h3>${esc(tit)} <span class="small muted">· promedio ${prom === null ? 'sin datos' : prom + ' %'} (${vals.length}/${lista.length} temas medidos)</span></h3>`);
    lista.sort((a, b) => a.prio.localeCompare(b.prio)).forEach((t) => c.appendChild(filaDominio(t.id)));
    p.appendChild(c);
  }
};

// ---------------- repaso ----------------
let repasoQuiz = null;
RENDER.repaso = () => {
  if (repasoQuiz) return;
  const p = $('#p-repaso'); p.innerHTML = '';
  const h = hoy();
  const pend = P27.repasoPendiente();
  const c = el('div', 'card', `<h2>Vuelven hoy (${pend.length})</h2>`);
  if (!pend.length) c.appendChild(el('p', 'muted', 'Nada pendiente. Cuando falles un tema, vuelve mañana y en 3 días.'));
  pend.forEach((t) => {
    const T = TEMAS[t] || { nombre: t };
    const f = el('div', 'dom-row');
    f.style.gridTemplateColumns = '1fr auto';
    const qs = Object.values(DIAG).flat().filter((q) => q.tema === t);
    f.innerHTML = `<div class="n">${esc(T.nombre)} <span class="small muted">· dominio ${P27.dominio(t) ?? '—'} %</span></div>`;
    const acc = el('div', 'fila');
    if (T.leccion) { const a = el('a', 'btn mini', 'Practicar en la lección'); a.href = T.leccion; a.style.textDecoration = 'none'; acc.appendChild(a); }
    if (qs.length) { const b = el('button', 'btn sec mini', `Rehacer ${qs.length} pregunta(s) del diagnóstico`); b.onclick = () => repasar(t, qs); acc.appendChild(b); }
    const m = el('button', 'btn sec mini', 'Marcar repasado'); m.onclick = () => { P27.cumplirRepaso(t); RENDER.repaso(); }; acc.appendChild(m);
    f.appendChild(acc); c.appendChild(f);
  });
  p.appendChild(c);
  // próximos días
  const r = cargar('repaso', []);
  const prox = {};
  for (const x of r) if (!x.hecho && x.due > h) (prox[x.due] = prox[x.due] || new Set()).add(x.tema);
  const c2 = el('div', 'card', '<h3>Próximos repasos</h3>');
  const fechas = Object.keys(prox).sort();
  if (!fechas.length) c2.appendChild(el('p', 'muted', 'Sin repasos programados.'));
  fechas.forEach((f) => c2.appendChild(el('p', '', `<b>${fechaCorta(f)}:</b> ${[...prox[f]].map((t) => esc(TEMAS[t]?.nombre || t)).join(', ')}`)));
  p.appendChild(c2);
};
function repasar(tema, qs) {
  const p = $('#p-repaso'); p.innerHTML = '';
  let i = 0;
  repasoQuiz = true;
  const volver = el('button', 'btn sec mini', '← Volver'); volver.onclick = () => { repasoQuiz = null; RENDER.repaso(); };
  p.appendChild(volver);
  const cont = el('div'); cont.style.marginTop = '10px'; p.appendChild(cont);
  const sig = () => {
    if (i >= qs.length) { repasoQuiz = null; RENDER.repaso(); return; }
    const q = qs[i++];
    if (q.prueba === 'LEN') cont.innerHTML = '';
    P27.pregunta(cont, q, { registrar: true, mezclar: true, onSiguiente: sig, textoSiguiente: i < qs.length ? 'Siguiente' : 'Terminar' });
    if (q.prueba === 'LEN') cont.insertBefore(el('details', 'acc', `<summary>Texto: ${esc(BANCO.LEN.titulo)}</summary><div class="in">${BANCO.LEN.texto}</div>`), cont.firstChild);
  };
  sig();
}

// ---------------- ensayos ----------------
const DEMRE = [
  ['Temario M2 (PDF)', 'https://demre.cl/publicaciones/pdf/2027-26-03-19-temario-paes-regular-m2.pdf'],
  ['Temario Ciencias (PDF)', 'https://demre.cl/publicaciones/pdf/2027-26-03-19-temario-paes-regular-ciencias.pdf'],
  ['Temario M1', 'https://demre.cl/publicaciones/2027/2027-26-03-19-temario-paes-regular-m1'],
  ['Temario Competencia Lectora', 'https://demre.cl/publicaciones/2027/2027-26-03-19-temario-paes-regular-competencia-lectora'],
  ['Contenidos nuevos 2027', 'https://demre.cl/noticias/2026-03-20-nuevos-contenidos-paes-regular-p2027'],
  ['Portada DEMRE (modelos y selecciones de preguntas)', 'https://demre.cl/'],
];
function tarjetaDemre() {
  return el('div', 'card', `<h3>Material oficial DEMRE</h3><p class="small muted">Para practicar con preguntas reales. Los modelos de prueba y las selecciones de preguntas están en demre.cl, sección Publicaciones. No pude abrir el sitio desde donde se construyó la app, así que no enlazo directo a los modelos: búscalos ahí.</p><ul>${DEMRE.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul>`);
}
RENDER.ensayos = () => {
  const p = $('#p-ensayos'); p.innerHTML = '';
  const ens = cargar('ensayos', []);
  const hechos = ens.filter((e) => e.estado === 'hecho').reverse();
  const curso = ens.find((e) => e.estado === 'en-curso');
  const c = el('div', 'card', `<h2>Ensayos cronometrados</h2>
    ${curso ? `<p class="aviso amar">Tienes un ensayo de ${esc(PRUEBAS[curso.prueba]?.corto || curso.prueba)} en curso: el reloj sigue corriendo. <a href="${curso.prueba === 'CIE' ? 'fisica.html' : 'm2.html'}#ensayo">Volver al ensayo</a></p>` : ''}
    <p><a class="btn" style="text-decoration:none" href="m2.html#ensayo">Ensayo de M2</a> <span class="small muted">· completo (55 preguntas, 2 h 20 min) o corto (20 preguntas, 50 min)</span></p>
    <p><a class="btn sec" style="text-decoration:none" href="fisica.html#ensayo">Ensayo de Física</a> <span class="small muted">· parcial (40 preguntas, 80 min) o corto (20, 40 min)</span></p>
    <p class="small muted">El ensayo completo de Ciencias (80 preguntas, con Biología y Química) y el de M1 (65 preguntas) llegan con la Fase 4.</p>
    ${hechos.length ? '<h3>Historial</h3>' + hechos.map((e) => `<p>${esc(e.prueba)} · ${fechaCorta(e.fecha)} · ${e.modo === 'corto' ? 'corto' : 'completo'} · <b>${e.correctas}/${e.total}</b> (${Math.round((e.correctas / e.total) * 100)} %)</p>`).join('') : '<p class="muted small">Aún no hay ensayos.</p>'}`);
  p.appendChild(c);
  p.appendChild(tarjetaDemre());
};

// ---------------- fichas ----------------
RENDER.fichas = () => {
  const p = $('#p-fichas'); p.innerHTML = '';
  p.appendChild(el('div', 'card', '<h2>Fichas finales</h2><p>Una página por prueba con fórmulas y trampas, para la mañana del examen. Llegan en la <b>Fase 5</b>. Mientras, cada lección de M2 ya trae su resumen en «El porqué».</p>'));
};

// ---------------- progreso ----------------
RENDER.progreso = () => {
  const p = $('#p-progreso'); p.innerHTML = '';
  p.appendChild(el('div', 'card', `<h2>Cómo abrir la app</h2><ol><li>Abre una terminal en la carpeta <code>paes27</code>.</li><li>Ejecuta <code>python -m http.server 8000</code> (o <code>python3 -m http.server 8000</code>).</li><li>Abre <code>http://localhost:8000</code> en Chrome.</li></ol><p class="small muted">Usa siempre el mismo puerto: el progreso se guarda en el navegador, separado por dirección y puerto. Si abres el archivo con doble clic (file://), las lecciones con módulos no cargan y tu progreso queda en otro lado.</p><h3>Versión en línea (Netlify)</h3><p class="small muted">Si la abres desde su dirección de Netlify (por ejemplo, en el celular), ese progreso es <b>distinto</b> del de localhost y del de otro dispositivo. Para moverlo: «Descargar respaldo» en uno e «Importar respaldo» en el otro.</p>`));
  const c = el('div', 'card', '<h2>Respaldo del progreso</h2><p class="small muted">Exporta un JSON para no perder nada si cambias de navegador o de puerto.</p>');
  const f = el('div', 'fila');
  const bExp = el('button', 'btn', 'Descargar respaldo (.json)');
  bExp.onclick = () => {
    const blob = new Blob([JSON.stringify(P27.exportar(), null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `paes27-progreso-${hoy()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const file = el('input'); file.type = 'file'; file.accept = 'application/json,.json'; file.hidden = true;
  const bImp = el('button', 'btn sec', 'Importar respaldo…'); bImp.onclick = () => file.click();
  file.onchange = async () => { if (!file.files[0]) return; importarTexto(await file.files[0].text()); };
  f.append(bExp, bImp, file); c.appendChild(f);
  const ta = el('textarea'); ta.placeholder = 'O pega aquí el contenido de un respaldo y aprieta «Importar texto».';
  const bTa = el('button', 'btn sec mini', 'Importar texto'); bTa.onclick = () => importarTexto(ta.value);
  const bVer = el('button', 'btn sec mini', 'Mostrar mi progreso como texto'); bVer.onclick = () => { ta.value = JSON.stringify(P27.exportar()); ta.select(); };
  c.append(el('div', '', '<br>'), ta, el('div', 'fila'));
  c.lastChild.append(bTa, bVer);
  p.appendChild(c);
  const c3 = el('div', 'card', '<h3>Empezar de cero</h3><p class="small muted">Borra diagnósticos, dominio, repaso, ruta y ensayos de este navegador.</p>');
  const bDel = el('button', 'btn sec', 'Borrar todo mi progreso');
  bDel.onclick = () => { if (confirm('¿Borrar TODO tu progreso? Descarga un respaldo antes si no estás seguro.')) { for (const k of Object.values(P27.K)) localStorage.removeItem(k); runner = null; location.hash = 'hoy'; mostrarTab('hoy'); } };
  c3.appendChild(bDel); p.appendChild(c3);
};
function importarTexto(txt) {
  try { P27.importar(JSON.parse(txt)); alert('Progreso importado.'); mostrarTab(tabActual()); }
  catch (e) { alert('No se pudo importar: ' + e.message); }
}

// ---------------- arranque ----------------
window.addEventListener('storage', (e) => { if (e.key && e.key.startsWith('paes27:') && !runner && !repasoQuiz) mostrarTab(tabActual()); });
avisoOrigen();
cuenta();
setInterval(cuenta, 60000);
mostrarTab(location.hash.slice(1) || 'hoy');
})();
</script>
