<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAES 2027 · Hub</title>
<style>
/* == paes27-css v1 == */
:root{--bg:#0d111c;--panel:#151b2b;--panel2:#1c2438;--line:#2a3450;--ink:#e7ecf6;--muted:#93a0bb;--acc:#8b7cf6;--acc2:#5ec8e5;--ok:#43c59e;--mal:#f0697a;--warn:#f2b84b;--m2:#8b7cf6;--cie:#5ec8e5;--m1:#7fd17a;--len:#f2a65a;--r:12px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc2)}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h2{font-size:1.3rem}h3{font-size:1.08rem}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:.55em 1em;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.mini{padding:.3em .7em;font-size:.88rem}
kbd{font:600 .72em ui-monospace,monospace;background:rgba(255,255,255,.14);border-radius:4px;padding:.05em .35em;margin-left:.3em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 4px}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;padding:.6em .9em;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.pane{display:none}.pane.on{display:block}
details.acc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:10px 0}
details.acc>summary{cursor:pointer;padding:.7em 1em;font-weight:600;list-style:none}
details.acc>summary::before{content:"▸ ";color:var(--acc)}details.acc[open]>summary::before{content:"▾ "}
details.acc>.in{padding:0 1em 1em}
.chip{display:inline-block;padding:.1em .55em;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.chip.A{color:#ffb4bd;border-color:#6b2f3a}.chip.B{color:#ffd98c;border-color:#6b5524}.chip.C{color:#a9b7d4}.chip.R{color:#9fe3c9;border-color:#245c4a}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q-meta{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.q-enun{font-size:1.04rem;margin-bottom:12px}
.q-enun table{border-collapse:collapse;margin:8px 0}.q-enun td,.q-enun th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.q-ops{display:grid;gap:8px}
.q-op{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.6em .8em;font:inherit;cursor:pointer}
.q-op:hover:not(:disabled){border-color:var(--acc)}
.q-op:disabled{cursor:default}
.q-op.ok{border-color:var(--ok);background:rgba(67,197,158,.13)}.q-op.mal{border-color:var(--mal);background:rgba(240,105,122,.13)}
.q-l{font-weight:800;color:var(--acc);min-width:1.2em}
.q-fb{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.q-trampa{margin:6px 0;padding:6px 10px;border-left:3px solid var(--mal);background:rgba(240,105,122,.08)}
.q-exp{margin-top:6px}
.q-acc{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.txt-ok{color:var(--ok)}.txt-mal{color:var(--mal)}.txt-warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
input[type=range]{accent-color:var(--acc);width:100%}
@media (max-width:600px){.wrap{padding:10px}.card{padding:12px}}
/* == fin paes27-css v1 == */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.5rem;margin:0}
.paginas{display:flex;gap:6px;flex-wrap:wrap}
.paginas a,.paginas span{padding:.35em .75em;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.paginas a.on{background:var(--acc);border-color:var(--acc)}
.paginas span{color:var(--muted);border-style:dashed}
.aviso{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.aviso.rojo{background:rgba(240,105,122,.15);border:1px solid var(--mal)}
.aviso.amar{background:rgba(242,184,75,.12);border:1px solid var(--warn)}
.cuenta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cuenta .ex{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;border-top:3px solid var(--c)}
.cuenta .ex b{font-size:1.25rem}
code{background:var(--panel2);padding:.1em .4em;border-radius:5px;font-size:.92em}
.diag-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.diag-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:3px solid var(--c)}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.prog{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;background:var(--acc)}
.len-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.len-texto{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:75vh;overflow:auto;position:sticky;top:8px}
.len-texto p{margin:.5em 0}
@media (max-width:800px){.len-layout{grid-template-columns:1fr}.len-texto{position:static;max-height:none}}
table.res{width:100%;border-collapse:collapse;font-size:.93rem}
table.res td,table.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.dia{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.dia>h3{margin:0;padding:10px 14px;background:var(--panel2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:1rem}
.dia.hoy{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dia.pasado{opacity:.6}
.bloque{display:grid;grid-template-columns:28px 96px 1fr;gap:8px;padding:9px 14px;border-top:1px solid var(--line);align-items:start}
.bloque:first-of-type{border-top:0}
.bloque .hora{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.bloque.hecho .tit{text-decoration:line-through;color:var(--muted)}
.bloque .tit{font-weight:600}
.bloque .det{color:var(--muted);font-size:.88rem}
.bloque input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.tag{font-size:.72rem;font-weight:800;padding:.05em .45em;border-radius:5px;margin-right:6px;color:#0d111c;background:var(--c)}
.dom-row{display:grid;grid-template-columns:1fr 150px 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dom-row .n{font-size:.95rem}.dom-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:560px){.dom-row{grid-template-columns:1fr 90px 42px}.bloque{grid-template-columns:24px 1fr}.bloque .hora{grid-column:2}.bloque>div:last-child{grid-column:2}}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:110px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:13px ui-monospace,monospace;padding:8px}
select,input[type=time],input[type=number]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:.3em .5em;font:inherit}
</style>
</head>

"LEN": {
"titulo":"El valor de aburrirse",
"texto":"<p><b>1</b> Durante siglos, el aburrimiento tuvo mala fama. Se lo asociaba con la pereza y, a veces, con un defecto del carácter. Sin embargo, en las últimas décadas varios investigadores empezaron a mirarlo de otra forma: no como una falla, sino como una señal.</p><p><b>2</b> Según esta idea, el aburrimiento funciona de un modo parecido al hambre. Así como el hambre avisa que el cuerpo necesita energía, el aburrimiento avisaría que lo que estamos haciendo ya no nos aporta nada y que conviene buscar otra cosa. En un experimento, un grupo de personas pasó quince minutos copiando números de una lista antes de inventar usos para un vaso plástico. Ese grupo propuso más ideas, y más variadas, que otro grupo que pasó directo a la tarea creativa.</p><p><b>3</b> El problema, advierten los mismos especialistas, es que hoy casi nunca dejamos que esa señal haga su trabajo. Basta un minuto de espera para que saquemos el teléfono. Llenamos cada hueco del día con estímulos breves y, así, la incomodidad desaparece antes de empujarnos hacia algo nuevo.</p><p><b>4</b> Nada de esto significa que el aburrimiento sea siempre bueno. Cuando se vuelve crónico, se relaciona con el desánimo y con conductas de riesgo. La clave, dicen, no está en buscarlo ni en huir de él, sino en escucharlo: preguntarse qué nos está pidiendo antes de taparlo con lo primero que tengamos a mano.</p>",

  function registrar(tema, nivel, ok, opts = {}) {
    const d = cargar('dominio', {});

    const fila = el('div', 'fila');
    const enCurso = diag.enCurso && diag.enCurso.prueba === pr;
    const b = el('button', 'btn', d ? 'Rehacer' : enCurso ? 'Continuar' : 'Empezar');
    if (d) b.className = 'btn sec';
    b.onclick = () => {
      if (d && !confirm('¿Rehacer este diagnóstico? Tu dominio se volverá a ajustar con las nuevas respuestas.')) return;
      iniciarDiag(pr, enCurso);
    };
    fila.appendChild(b);
    if (d) { const v = el('button', 'btn sec', 'Ver resultado'); v.onclick = () => verResultado(pr); fila.appendChild(v); }
    c.appendChild(fila);
    grid.appendChild(c);
  }
  p.appendChild(grid);
};

function iniciarDiag(pr, reanudar) {
  const diag = cargar('diag', {});
  if (reanudar && diag.enCurso && diag.enCurso.prueba === pr) runner = { ...diag.enCurso };
  else runner = { prueba: pr, i: 0, respuestas: [], seg: 0 };
  // un solo diagnóstico en curso a la vez
  diag.enCurso = { ...runner }; guardar('diag', diag);
  location.hash = 'diag';
  pintarPregunta();
}

function guardarEnCurso() {
  const diag = cargar('diag', {});
  diag.enCurso = { prueba: runner.prueba, i: runner.i, respuestas: runner.respuestas, seg: runner.seg };
  guardar('diag', diag);
}

function pintarPregunta() {
  const p = $('#p-diag'); p.innerHTML = '';
  const pr = runner.prueba; const qs = DIAG[pr]; const q = qs[runner.i];
  const top = el('div', 'run-top');
  top.innerHTML = `<div><b>Diagnóstico ${esc(PRUEBAS[pr].nombre)}</b> · pregunta ${runner.i + 1} de ${qs.length}</div><div class="small"><span id="reloj"></span> <span class="muted">· ritmo PAES ${fmtMin(RITMO[pr] * 60)} por pregunta</span></div>`;
  const salir = el('button', 'btn sec mini', 'Pausar y salir');
  salir.onclick = () => { clearInterval(timerId); runner = null; RENDER.diag(); };
  top.appendChild(salir);
  p.appendChild(top);
  p.appendChild(el('div', 'prog', `<i style="width:${(runner.i / qs.length) * 100}%"></i>`));
  let cont = p;
  if (pr === 'LEN') {
    const lay = el('div', 'len-layout');
    lay.appendChild(el('div', 'len-texto', `<h3>${esc(BANCO.LEN.titulo)}</h3>${BANCO.LEN.texto}`));
    cont = el('div'); lay.appendChild(cont); p.appendChild(lay);
  } else { cont = el('div'); p.appendChild(cont); }
  const t0 = Date.now();
  const reloj = () => { const r = $('#reloj'); if (r) r.textContent = `⏱ ${fmtMin(runner.seg + (Date.now() - t0) / 1000)}`; };
  clearInterval(timerId); timerId = setInterval(reloj, 1000); reloj();
  let tResp = null;
  P27.pregunta(cont, q, {
    noSe: true,
    meta: `${esc(q.eje)} · ${esc(TEMAS[q.tema]?.nombre || q.tema)}`,
    textoSiguiente: runner.i + 1 < qs.length ? 'Siguiente' : 'Ver resultado',
    onRespuesta: ({ ok, elegida }) => {
      tResp = (Date.now() - t0) / 1000;
      runner.seg += tResp;
      clearInterval(timerId);
      runner.respuestas.push({ id: q.id, tema: q.tema, nivel: q.nivel, ok, elegida, seg: Math.round(tResp) });
      runner.i += 1;
      guardarEnCurso();
    },
    onSiguiente: () => { if (runner.i < qs.length) pintarPregunta(); else finalizarDiag(); },
  });
}

function finalizarDiag() {
  const pr = runner.prueba;
  const diag = cargar('diag', {});
  const resp = runner.respuestas;
  for (const r of resp) P27.registrar(r.tema, r.nivel, r.ok, { diag: true });
  const d2 = cargar('diag', {});
  d2[pr] = { fecha: hoy(), correctas: resp.filter((r) => r.ok).length, total: resp.length, seg: Math.round(runner.seg), respuestas: resp };
  delete d2.enCurso;
  guardar('diag', d2);
  runner = null;
  generarRuta();
  verResultado(pr);
  void diag;
}

function verResultado(pr) {
  const p = $('#p-diag'); p.innerHTML = '';
  const d = cargar('diag', {})[pr];
  if (!d) { RENDER.diag(); return; }
  const qs = Object.fromEntries(DIAG[pr].map((q) => [q.id, q]));
  const volver = el('button', 'btn sec mini', '← Volver a diagnósticos'); volver.onclick = () => RENDER.diag();
  p.appendChild(volver);
  const c = el('div', 'card');
  const pct = Math.round((d.correctas / d.total) * 100);
  let h = `<h2>${esc(PRUEBAS[pr].nombre)}: ${d.correctas}/${d.total} (${pct} %)</h2><p class="muted">Tiempo: ${fmtMin(d.seg)} min · promedio ${fmtMin(d.seg / d.total)} por pregunta (ritmo PAES ${fmtMin(RITMO[pr] * 60)}).</p>`;
  if (pr === 'CIE') {
    const fis = d.respuestas.filter((r) => r.tema.startsWith('fis.'));
    const bq = d.respuestas.filter((r) => /^(bio|qui)\./.test(r.tema));
    const okBq = bq.filter((r) => r.ok).length;
    h += `<p>Física: <b>${fis.filter((r) => r.ok).length}/${fis.length}</b> · Biología/Química: <b>${okBq}/${bq.length}</b></p>`;
    h += `<p class="small">${okBq <= 2 ? 'El Módulo Común trae preguntas de Biología y Química: con este resultado, el rescate vale la pena. La ruta te da <b>2 bloques diarios</b> el jueves y el viernes.' : 'Tu base de Biología/Química está aceptable: la ruta deja <b>1 bloque diario</b> de rescate rápido y el resto para Física.'}</p>`;
  }
  // por eje
  const ejes = {};
  for (const r of d.respuestas) { const e = qs[r.id]?.eje || '—'; ejes[e] = ejes[e] || [0, 0]; ejes[e][1]++; if (r.ok) ejes[e][0]++; }
  h += '<table class="res"><tr><th>Eje</th><th>Correctas</th></tr>' + Object.entries(ejes).map(([e, [a, b]]) => `<tr><td>${esc(e)}</td><td>${a}/${b}</td></tr>`).join('') + '</table>';
  c.innerHTML = h; p.appendChild(c);
  const c2 = el('div', 'card', '<h3>Pregunta por pregunta</h3>');
  const tb = el('table', 'res');
  tb.innerHTML = '<tr><th></th><th>Tema</th><th>Tiempo</th><th></th></tr>' + d.respuestas.map((r, i) => {
    const t = TEMAS[r.tema];
    const lnk = t && t.leccion ? `<a href="${t.leccion}">lección</a>` : '';
    return `<tr><td>${r.ok ? '<span class="txt-ok">✔</span>' : r.elegida === -1 ? '<span class="txt-warn">—</span>' : '<span class="txt-mal">✘</span>'} ${i + 1}</td><td>${esc(t?.nombre || r.tema)}</td><td>${r.seg}s</td><td>${lnk}</td></tr>`;
  }).join('');
  c2.appendChild(tb); p.appendChild(c2);
  const fallas = d.respuestas.filter((r) => !r.ok);
  if (fallas.length) {
    const c3 = el('div', 'card', '<h3>Revisa tus errores</h3><p class="small muted">Cada tema fallado vuelve en el repaso de mañana y en 3 días.</p>');
    fallas.forEach((r) => {
      const q = qs[r.id]; if (!q) return;
      const det = el('details', 'acc');
      det.innerHTML = `<summary>${esc(TEMAS[r.tema]?.nombre || r.tema)}</summary><div class="in"><div>${q.enunciado}</div>${r.elegida >= 0 ? `<p class="q-trampa"><b>Marcaste:</b> ${q.opciones[r.elegida].texto}. <b>La trampa:</b> ${q.opciones[r.elegida].trampa}</p>` : '<p class="muted">No respondiste.</p>'}<p><b>Correcta:</b> ${q.opciones[q.correcta].texto}. ${q.explicacion}</p></div>`;
      c3.appendChild(det);
    });
    p.appendChild(c3);
  }
  const sig = ORDEN_DIAG.find((x) => !cargar('diag', {})[x]);
  const f = el('div', 'fila');
  if (sig) { const b = el('button', 'btn', `Siguiente diagnóstico: ${PRUEBAS[sig].corto}`); b.onclick = () => iniciarDiag(sig, false); f.appendChild(b); }
  const r = el('button', 'btn sec', 'Ver mi ruta ajustada'); r.onclick = () => { location.hash = 'ruta'; }; f.appendChild(r);
  p.appendChild(f);
}

// ---------------- ruta ----------------
RENDER.ruta = () => {
  const p = $('#p-ruta'); p.innerHTML = '';
  const ruta = rutaActual();
  const diag = cargar('diag', {});
  const cfg = el('div', 'card');
  cfg.innerHTML = `<div class="fila"><label>Bloques de 50 min por día: <select id="selN">${[3, 4, 5, 6, 7, 8, 9, 10].map((n) => `<option ${n === ruta.N ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
  <label>Empiezo a las <input type="time" id="selIni" value="${esc(ruta.inicio)}"></label>
  <button class="btn sec mini" id="btnRecalc">Recalcular desde hoy</button></div>
  <p class="small muted" style="margin:.6em 0 0">Cada bloque: 50 min de estudio + 10 de pausa, con 1 h de almuerzo después del 3.º. El orden sale de <b>peso del tema × (1 − dominio) × cercanía de la prueba</b>: M2 pesa más al principio porque se rinde primero. Los días pasados no se tocan.</p>`;
  p.appendChild(cfg);
  const regen = () => { generarRuta({ N: Number($('#selN').value), inicio: $('#selIni').value || '09:00' }); RENDER.ruta(); };
  cfg.querySelector('#selN').onchange = regen;
  cfg.querySelector('#selIni').onchange = regen;
  cfg.querySelector('#btnRecalc').onclick = regen;
  for (const f of DIAS_RUTA) p.appendChild(tarjetaDia(f, ruta, diag));
  for (const f of Object.keys(EVENTOS)) p.appendChild(tarjetaEvento(f));
};

// ---------------- dominio ----------------
function filaDominio(t) {
  const T = TEMAS[t]; const v = P27.dominio(t);
  const r = el('div', 'dom-row');
  const nombre = T.leccion ? `<a href="${T.leccion}" style="color:inherit">${esc(T.nombre)}</a>` : esc(T.nombre);
  const pr = T.prueba === 'CIE' && T.prio === 'R' ? 'B/Q' : PRUEBAS[T.prueba].corto;
  r.innerHTML = `<div class="n"><span class="chip ${T.prio}">${T.prio}</span> ${nombre} <span class="small muted">· ${esc(pr)}</span></div><div class="bar"><i style="width:${v ?? 0}%;background:${P27.colorDominio(v)}"></i></div><div class="v" style="color:${P27.colorDominio(v)}">${v === null ? '—' : v + '%'}</div>`;
  return r;
}
RENDER.dominio = () => {
  const p = $('#p-dominio'); p.innerHTML = '';
  p.appendChild(el('p', 'muted small', 'Dominio de 0 a 100 %. Sube y baja con cada respuesta (pesa más acertar una difícil y fallar una básica). «—» = aún sin datos; para planificar se usa un valor inicial según tu nivel (M2 y Física 30 %, M1 60 %, Lectora 50 %). Prioridad: <span class="chip A">A</span> sale mucho y estás débil · <span class="chip B">B</span> · <span class="chip C">C</span> · <span class="chip R">R</span> rescate.'));
  const grupos = [['M2', 'M2', 'ABC'], ['Física', 'CIE', 'ABC'], ['Biología y Química (rescate)', 'CIE', 'R'], ['M1', 'M1', 'ABC'], ['Competencia Lectora', 'LEN', 'ABC']];
  for (const [tit, pr, prios] of grupos) {
    const lista = Object.values(TEMAS).filter((t) => t.prueba === pr && prios.includes(t.prio));
    const vals = lista.map((t) => P27.dominio(t.id)).filter((v) => v !== null);
    const prom = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    const c = el('div', 'card', `<h3>${esc(tit)} <span class="small muted">· promedio ${prom === null ? 'sin datos' : prom + ' %'} (${vals.length}/${lista.length} temas medidos)</span></h3>`);
    lista.sort((a, b) => a.prio.localeCompare(b.prio)).forEach((t) => c.appendChild(filaDominio(t.id)));
    p.appendChild(c);
  }
};

// ---------------- repaso ----------------
let repasoQuiz = null;
RENDER.repaso = () => {
  if (repasoQuiz) return;
  const p = $('#p-repaso'); p.innerHTML = '';
  const h = hoy();
  const pend = P27.repasoPendiente();
  const c = el('div', 'card', `<h2>Vuelven hoy (${pend.length})</h2>`);
  if (!pend.length) c.appendChild(el('p', 'muted', 'Nada pendiente. Cuando falles un tema, vuelve mañana y en 3 días.'));
  pend.forEach((t) => {
    const T = TEMAS[t] || { nombre: t };
    const f = el('div', 'dom-row');
    f.style.gridTemplateColumns = '1fr auto';
    const qs = Object.values(DIAG).flat().filter((q) => q.tema === t);
    f.innerHTML = `<div class="n">${esc(T.nombre)} <span class="small muted">· dominio ${P27.dominio(t) ?? '—'} %</span></div>`;
    const acc = el('div', 'fila');
    if (T.leccion) { const a = el('a', 'btn mini', 'Practicar en la lección'); a.href = T.leccion; a.style.textDecoration = 'none'; acc.appendChild(a); }
    if (qs.length) { const b = el('button', 'btn sec mini', `Rehacer ${qs.length} pregunta(s) del diagnóstico`); b.onclick = () => repasar(t, qs); acc.appendChild(b); }
    const m = el('button', 'btn sec mini', 'Marcar repasado'); m.onclick = () => { P27.cumplirRepaso(t); RENDER.repaso(); }; acc.appendChild(m);
    f.appendChild(acc); c.appendChild(f);
  });
  p.appendChild(c);
  // próximos días
  const r = cargar('repaso', []);
  const prox = {};
  for (const x of r) if (!x.hecho && x.due > h) (prox[x.due] = prox[x.due] || new Set()).add(x.tema);
  const c2 = el('div', 'card', '<h3>Próximos repasos</h3>');
  const fechas = Object.keys(prox).sort();
  if (!fechas.length) c2.appendChild(el('p', 'muted', 'Sin repasos programados.'));
  fechas.forEach((f) => c2.appendChild(el('p', '', `<b>${fechaCorta(f)}:</b> ${[...prox[f]].map((t) => esc(TEMAS[t]?.nombre || t)).join(', ')}`)));
  p.appendChild(c2);
};
function repasar(tema, qs) {
  const p = $('#p-repaso'); p.innerHTML = '';
  let i = 0;
  repasoQuiz = true;
  const volver = el('button', 'btn sec mini', '← Volver'); volver.onclick = () => { repasoQuiz = null; RENDER.repaso(); };
  p.appendChild(volver);
  const cont = el('div'); cont.style.marginTop = '10px'; p.appendChild(cont);
  const sig = () => {
    if (i >= qs.length) { repasoQuiz = null; RENDER.repaso(); return; }
    const q = qs[i++];
    if (q.prueba === 'LEN') cont.innerHTML = '';
    P27.pregunta(cont, q, { registrar: true, mezclar: true, onSiguiente: sig, textoSiguiente: i < qs.length ? 'Siguiente' : 'Terminar' });
    if (q.prueba === 'LEN') cont.insertBefore(el('details', 'acc', `<summary>Texto: ${esc(BANCO.LEN.titulo)}</summary><div class="in">${BANCO.LEN.texto}</div>`), cont.firstChild);
  };
  sig();
}

// ---------------- ensayos ----------------
const DEMRE = [
  ['Temario M2 (PDF)', 'https://demre.cl/publicaciones/pdf/2027-26-03-19-temario-paes-regular-m2.pdf'],
  ['Temario Ciencias (PDF)', 'https://demre.cl/publicaciones/pdf/2027-26-03-19-temario-paes-regular-ciencias.pdf'],
  ['Temario M1', 'https://demre.cl/publicaciones/2027/2027-26-03-19-temario-paes-regular-m1'],
  ['Temario Competencia Lectora', 'https://demre.cl/publicaciones/2027/2027-26-03-19-temario-paes-regular-competencia-lectora'],
  ['Contenidos nuevos 2027', 'https://demre.cl/noticias/2026-03-20-nuevos-contenidos-paes-regular-p2027'],
  ['Portada DEMRE (modelos y selecciones de preguntas)', 'https://demre.cl/'],
];
function tarjetaDemre() {
  return el('div', 'card', `<h3>Material oficial DEMRE</h3><p class="small muted">Para practicar con preguntas reales. Los modelos de prueba y las selecciones de preguntas están en demre.cl, sección Publicaciones. No pude abrir el sitio desde donde se construyó la app, así que no enlazo directo a los modelos: búscalos ahí.</p><ul>${DEMRE.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul>`);
}
RENDER.ensayos = () => {
  const p = $('#p-ensayos'); p.innerHTML = '';
  const ens = cargar('ensayos', []);
  p.appendChild(el('div', 'card', `<h2>Ensayos cronometrados</h2><p>El modo ensayo con tiempos reales (M2: 55 preguntas en 2 h 20 min; Ciencias: 80 en 2 h 40 min; M1: 65 en 2 h 20 min) llega en la <b>Fase 2</b>, empezando por M2.</p>${ens.length ? '<h3>Historial</h3>' + ens.map((e) => `<p>${esc(e.prueba)} · ${esc(e.fecha)} · ${e.correctas}/${e.total}</p>`).join('') : '<p class="muted small">Aún no hay ensayos registrados.</p>'}`));
  p.appendChild(tarjetaDemre());
};

// ---------------- fichas ----------------
RENDER.fichas = () => {
  const p = $('#p-fichas'); p.innerHTML = '';
  p.appendChild(el('div', 'card', '<h2>Fichas finales</h2><p>Una página por prueba con fórmulas y trampas, para la mañana del examen. Llegan en la <b>Fase 5</b>. Mientras, cada lección de M2 ya trae su resumen en «El porqué».</p>'));
};

// ---------------- progreso ----------------
RENDER.progreso = () => {
  const p = $('#p-progreso'); p.innerHTML = '';
  p.appendChild(el('div', 'card', `<h2>Cómo abrir la app</h2><ol><li>Abre una terminal en la carpeta <code>paes27</code>.</li><li>Ejecuta <code>python -m http.server 8000</code> (o <code>python3 -m http.server 8000</code>).</li><li>Abre <code>http://localhost:8000</code> en Chrome.</li></ol><p class="small muted">Usa siempre el mismo puerto: el progreso se guarda en el navegador, separado por dirección y puerto. Si abres el archivo con doble clic (file://), las lecciones con módulos no cargan y tu progreso queda en otro lado.</p>`));
  const c = el('div', 'card', '<h2>Respaldo del progreso</h2><p class="small muted">Exporta un JSON para no perder nada si cambias de navegador o de puerto.</p>');
  const f = el('div', 'fila');
  const bExp = el('button', 'btn', 'Descargar respaldo (.json)');
  bExp.onclick = () => {
    const blob = new Blob([JSON.stringify(P27.exportar(), null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `paes27-progreso-${hoy()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const file = el('input'); file.type = 'file'; file.accept = 'application/json,.json'; file.hidden = true;
  const bImp = el('button', 'btn sec', 'Importar respaldo…'); bImp.onclick = () => file.click();
  file.onchange = async () => { if (!file.files[0]) return; importarTexto(await file.files[0].text()); };
  f.append(bExp, bImp, file); c.appendChild(f);
  const ta = el('textarea'); ta.placeholder = 'O pega aquí el contenido de un respaldo y aprieta «Importar texto».';
  const bTa = el('button', 'btn sec mini', 'Importar texto'); bTa.onclick = () => importarTexto(ta.value);
  const bVer = el('button', 'btn sec mini', 'Mostrar mi progreso como texto'); bVer.onclick = () => { ta.value = JSON.stringify(P27.exportar()); ta.select(); };
  c.append(el('div', '', '<br>'), ta, el('div', 'fila'));
  c.lastChild.append(bTa, bVer);
  p.appendChild(c);
  const c3 = el('div', 'card', '<h3>Empezar de cero</h3><p class="small muted">Borra diagnósticos, dominio, repaso, ruta y ensayos de este navegador.</p>');
  const bDel = el('button', 'btn sec', 'Borrar todo mi progreso');
  bDel.onclick = () => { if (confirm('¿Borrar TODO tu progreso? Descarga un respaldo antes si no estás seguro.')) { for (const k of Object.values(P27.K)) localStorage.removeItem(k); runner = null; location.hash = 'hoy'; mostrarTab('hoy'); } };
  c3.appendChild(bDel); p.appendChild(c3);
};
function importarTexto(txt) {
  try { P27.importar(JSON.parse(txt)); alert('Progreso importado.'); mostrarTab(tabActual()); }
  catch (e) { alert('No se pudo importar: ' + e.message); }
}

// ---------------- arranque ----------------
window.addEventListener('storage', (e) => { if (e.key && e.key.startsWith('paes27:') && !runner && !repasoQuiz) mostrarTab(tabActual()); });
avisoOrigen();
cuenta();
setInterval(cuenta, 60000);
mostrarTab(location.hash.slice(1) || 'hoy');
})();
</script>
